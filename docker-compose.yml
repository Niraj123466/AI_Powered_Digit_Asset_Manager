version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dam-postgres
    environment:
      POSTGRES_USER: dam
      POSTGRES_PASSWORD: dam
      POSTGRES_DB: dam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dam -d dam"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dam-network

  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: dam-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6333/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dam-network

  # Optional: Ollama for local LLM/Vision models
  # Uncomment and run `docker compose --profile ollama up` to enable
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: dam-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   profiles:
  #     - ollama
  #   networks:
  #     - dam-network

volumes:
  postgres_data:
  qdrant_data:
  # ollama_data:

networks:
  dam-network:
    driver: bridge